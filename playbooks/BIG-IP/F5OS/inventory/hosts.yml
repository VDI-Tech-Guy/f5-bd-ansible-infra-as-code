---
all:
  children:

    # ================================================================
    # F5OS HA Pair — Node A and Node B
    #
    # Each physical F5OS device hosts one BIG-IP tenant.
    # HA exists at the BIG-IP tenant layer (ConfigSync / failover).
    #
    #   F5OS Node A  (f5os-node-a)  →  Tenant: bigip-01  (primary)
    #   F5OS Node B  (f5os-node-b)  →  Tenant: bigip-02  (secondary)
    #
    # Node A and Node B should be separate physical devices for production
    # HA (no shared hardware failure domain). Co-locating both tenants on
    # the same device is valid for lab use — the code does not enforce
    # separation.
    #
    # For rSeries:  ansible_host = rSeries partition management IP
    # For Velos:    ansible_host = Velos partition IP (not chassis controller)
    # ================================================================
    f5os_partitions:
      vars:
        ansible_network_os: f5networks.f5os.f5os
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_httpapi_port: 443
        ansible_command_timeout: 1800
      hosts:
        f5os-node-a:
          ansible_host: "192.168.10.31"    # rSeries-1 or Velos-Chassis-1 partition IP
        f5os-node-b:
          ansible_host: "192.168.10.32"    # rSeries-2 or Velos-Chassis-2 partition IP

    # ----------------------------------------------------------------
    # BIG-IP tenant layer
    # f5os_partition_host ties each tenant back to its F5OS node.
    # DO REST calls run from localhost — no SSH into the tenant needed.
    # ----------------------------------------------------------------
    f5_nodes:
      hosts:
        bigip-01:
          f5_mgmt_ip: "10.30.14.11"
          f5_hostname: "bigip-01.yourdomain.local"
          f5_self_internal: "10.30.10.11/24"
          f5_self_external: "10.30.11.11/24"
          f5_self_ha: "10.30.12.11/24"
          f5os_partition_host: "f5os-node-a"    # lives on Node A
        bigip-02:
          f5_mgmt_ip: "10.30.14.12"
          f5_hostname: "bigip-02.yourdomain.local"
          f5_self_internal: "10.30.10.12/24"
          f5_self_external: "10.30.11.12/24"
          f5_self_ha: "10.30.12.12/24"
          f5os_partition_host: "f5os-node-b"    # lives on Node B

    # ----------------------------------------------------------------
    # All F5OS API calls and DO REST calls run from localhost (EE).
    # AAP credential injects ANSIBLE_NET_PASSWORD for BIG-IP admin/root.
    # ----------------------------------------------------------------
    f5os_automation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
