---
# Role: f5_wait_mgmt
# Waits for BIG-IP management HTTPS to be reachable, then polls iControl REST
# until configReady = yes. All tasks run on localhost — no SSH into tenant.
# Direct port from the OpenShift and VMware implementations.

- name: Wait for BIG-IP management HTTPS (port 443) on {{ node_name }}
  ansible.builtin.wait_for:
    host: "{{ hostvars[node_name].f5_mgmt_ip }}"
    port: 443
    delay: 60
    timeout: 1200
    state: started
  delegate_to: localhost

- name: Poll BIG-IP iControl REST until device config is ready on {{ node_name }}
  ansible.builtin.uri:
    url: "https://{{ hostvars[node_name].f5_mgmt_ip }}/mgmt/tm/sys/ready"
    method: GET
    user: admin
    password: "{{ f5_admin_password }}"
    validate_certs: false
    status_code: [200]
    return_content: true
  register: bigip_ready
  until: >
    bigip_ready.status == 200 and
    (bigip_ready.json.entries | default({}) | dict2items |
     selectattr('value.nestedStats.entries.configReady.description', 'equalto', 'yes') |
     list | length > 0)
  retries: 40
  delay: 30
  delegate_to: localhost
  no_log: true

- name: Confirm {{ node_name }} is ready for onboarding
  ansible.builtin.debug:
    msg: "{{ node_name }} ({{ hostvars[node_name].f5_mgmt_ip }}) is ready for onboarding"
