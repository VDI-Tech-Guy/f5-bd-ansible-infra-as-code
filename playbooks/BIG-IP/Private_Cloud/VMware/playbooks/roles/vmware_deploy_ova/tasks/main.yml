---
# Role: vmware_deploy_ova
# Mounts CIFS share on bastion, fetches the OVA to the EE (localhost),
# deploys it directly as a named VM for this node — no template, no snapshot.
# Caches the DO RPM on the bastion while the share is mounted.
# Unmounts the CIFS share in the always block (clean up whether pass or fail).
# Idempotent — skips OVA deploy if the VM already exists.
#
# Call with: vars: { node_name: "bigip-01" }

- name: Set VM name fact for {{ node_name }}
  ansible.builtin.set_fact:
    f5_vm_name: "{{ vm_name_prefix }}-{{ node_name }}"

# ------------------------------------------------------------------
# Idempotency — skip if VM already exists
# ------------------------------------------------------------------

- name: Check if VM already exists for {{ node_name }}
  community.vmware.vmware_guest_info:
    hostname: "{{ lookup('env', 'VMWARE_HOST') }}"
    username: "{{ lookup('env', 'VMWARE_USER') }}"
    password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ datacenter_name }}"
    name: "{{ f5_vm_name }}"
  register: vm_exists_check
  failed_when: false

- name: Report VM already exists — skipping OVA deploy for {{ node_name }}
  ansible.builtin.debug:
    msg: "VM '{{ f5_vm_name }}' already exists — skipping OVA deploy"
  when: vm_exists_check.instance is defined

# ------------------------------------------------------------------
# OVA deploy block
# ------------------------------------------------------------------

- name: OVA deploy block for {{ node_name }}
  when: vm_exists_check.instance is not defined
  block:

    - name: Ensure cifs-utils is installed on bastion
      ansible.builtin.package:
        name: cifs-utils
        state: present
      become: true
      delegate_to: bastion01

    - name: Create CIFS mount point on bastion
      ansible.builtin.file:
        path: "{{ cifs_mountpoint }}"
        state: directory
        mode: '0755'
      become: true
      delegate_to: bastion01

    - name: Mount CIFS share on bastion
      ansible.posix.mount:
        src: "{{ cifs_share }}"
        path: "{{ cifs_mountpoint }}"
        fstype: cifs
        opts: "username={{ cifs_username }},password={{ cifs_password }},domain={{ cifs_domain }},uid=0,gid=0,file_mode=0644,dir_mode=0755"
        state: mounted
      become: true
      delegate_to: bastion01

    - name: Verify OVA exists on CIFS share
      ansible.builtin.stat:
        path: "{{ cifs_mountpoint }}/{{ ova_filename }}"
      register: ova_stat
      delegate_to: bastion01
      failed_when: not ova_stat.stat.exists

    - name: Verify DO RPM exists on CIFS share
      ansible.builtin.stat:
        path: "{{ cifs_mountpoint }}/{{ do_filename }}"
      register: do_rpm_stat
      delegate_to: bastion01
      failed_when:
        - do_rpm_install_from_cifs | default(false) | bool
        - not do_rpm_stat.stat.exists
      when: do_rpm_install_from_cifs | default(false) | bool

    # Cache the DO RPM onto the bastion while the share is mounted.
    # This mirrors the OpenShift f5_image_upload role pattern.
    - name: Create F5 cache directory on bastion
      ansible.builtin.file:
        path: "{{ bastion_f5_cache }}"
        state: directory
        mode: '0755'
      become: true
      delegate_to: bastion01
      when: do_rpm_install_from_cifs | default(false) | bool

    - name: Cache DO RPM on bastion from CIFS
      ansible.builtin.copy:
        src: "{{ cifs_mountpoint }}/{{ do_filename }}"
        dest: "{{ bastion_f5_cache }}/{{ do_filename }}"
        remote_src: true
        mode: '0644'
      delegate_to: bastion01
      when: do_rpm_install_from_cifs | default(false) | bool

    # vmware_deploy_ovf reads the OVA from the Ansible control node / EE.
    # Fetch the OVA from the bastion CIFS mount to the EE /tmp.
    - name: Create local OVA cache directory on EE
      ansible.builtin.file:
        path: "/tmp/f5_ova_cache"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Fetch OVA from bastion to EE /tmp
      ansible.builtin.fetch:
        src: "{{ cifs_mountpoint }}/{{ ova_filename }}"
        dest: "/tmp/f5_ova_cache/{{ ova_filename }}"
        flat: true
      delegate_to: bastion01

    # Deploy OVA directly as the final named VM — no template, no snapshot.
    # Networks map by OVA label → vSphere port group name.
    - name: Deploy F5 OVA as {{ f5_vm_name }}
      community.vmware.vmware_deploy_ovf:
        hostname: "{{ lookup('env', 'VMWARE_HOST') }}"
        username: "{{ lookup('env', 'VMWARE_USER') }}"
        password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ datacenter_name }}"
        cluster: "{{ cluster_name }}"
        datastore: "{{ datastore }}"
        resource_pool: "{{ resource_pool_name }}"
        name: "{{ f5_vm_name }}"
        networks:
          Management: "{{ vsphere_mgmt_network }}"
          Internal:   "{{ vsphere_internal_network }}"
          External:   "{{ vsphere_external_network }}"
          HA:         "{{ vsphere_ha_network }}"
        deployment_option: "{{ ova_deployment_option }}"
        power_on: false
        ovf: "/tmp/f5_ova_cache/{{ ova_filename }}"
        wait_for_ip_address: false
      delegate_to: localhost

    - name: Clean up OVA from EE /tmp cache
      ansible.builtin.file:
        path: "/tmp/f5_ova_cache/{{ ova_filename }}"
        state: absent
      delegate_to: localhost

  always:
    - name: Unmount CIFS share on bastion
      ansible.posix.mount:
        path: "{{ cifs_mountpoint }}"
        state: unmounted
      become: true
      delegate_to: bastion01
      when: vm_exists_check.instance is not defined

- name: Report OVA deploy complete for {{ node_name }}
  ansible.builtin.debug:
    msg: "VM '{{ f5_vm_name }}' deployed successfully from OVA (powered off, ready for vApp configuration)"
  when: vm_exists_check.instance is not defined
